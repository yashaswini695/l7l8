<!DOCTYPE html>
<html lang="en">
<head>
    <title>Embedded Internal CSS Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        p {
            color: #666;
            line-height: 1.6;
        }
        .highlight {
            background-color: #ff0;
            padding: 5px;
        }
    </style>
</head>
<body>
    <h1>Welcome to My Webpage</h1>
    <p>This is a paragraph demonstrating the use of embedded internal CSS.</p>
    <p class="highlight">This paragraph has a highlighted background using a CSS class.</p>
</body>
</html>
